<!DOCTYPE html>
<html lang="as">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>For Farida ❤️</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;600;700&family=Noto+Sans+Assamese:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- WATERMARK -->
    <div class="watermark">
        beingsarifulkhan
    </div>

    <div class="glow glow-one"></div>
    <div class="glow glow-two"></div>

    <div class="hearts"></div>

    <main class="container">

        <section class="love-card">

            <div class="big-heart">❤️</div>

            <div class="roses">
                🌹 ✨ 🌹 ✨ 🌹
            </div>

            <h1>Farida Khatun ❤️</h1>

            <div class="love-letter">

                <p>
                    Farida Khatun ❤️
                </p>

                <p>
                    মই তোমাক মনৰ পৰা ভাল পাওঁ।
                </p>

                <p>
                    তোমাক মই বহুত বেছি ভাল পাওঁ।
                </p>

                <p>
                    তুমি মোৰ বাবে বহুত বিশেষ।
                </p>

            </div>

            <h2>Will You Marry Me? 💍</h2>

            <div class="buttons">

                <button
                    class="yes-btn"
                    onclick="goToYesPage()">
                    YES ❤️
                </button>

                <button
                    class="no-btn"
                    onclick="goToNoPage()">
                    NO 💔
                </button>

            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
